name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true
  

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Generate API documentation
        run: |
          sphinx-apidoc \
            --force \
            --module-first \
            --separate \
            -o docs/source/api/generated \
            src/python/ensembl/tools/anno
      
      - name: Build HTML documentation
        run: |
          sphinx-build \
            -b html \
            docs/source \
            docs/build/html

      - name: Check links
        run: |
          sphinx-build \
            -b linkcheck \
            docs/source \
            docs/build/linkcheck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/github_actions'
        uses: actions/deploy-pages@v4