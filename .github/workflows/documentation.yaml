name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Generate API documentation
        run: |
          sphinx-apidoc \
            --force \
            --module-first \
            --separate \
            -o docs/source/api/generated \
            src/python/ensembl/tools/anno

      - name: Build HTML documentation
        run: |
          sphinx-build \
            -b html \
            docs/source \
            docs/build/html

      - name: Check links
        run: |
          sphinx-build \
            -b linkcheck \
            docs/source \
            docs/build/linkcheck

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/github_actions'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/html
          force_orphan: true