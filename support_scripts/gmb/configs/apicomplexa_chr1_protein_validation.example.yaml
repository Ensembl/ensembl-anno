# Apicomplexa chr1 protein-validation overlay -- Plasmodium falciparum GCA_000002765.3
#
# This is a LOCAL EXAMPLE, not a portable default: `diamond_db` below must be
# set to a real path before use (see comment on that key) and is not tracked
# with a working value. Copy this file and fill in your own path rather than
# editing it in place, or override protein_validation.diamond_db via your
# own config.
#
# This is a small OVERLAY, layered on top of apicomplexa_first_pass.yaml via
# a repeated --config (gmb.pipeline.config.load_config() accepts either a
# single path or an ordered list of paths, later ones winning per-key --
# see gmb-build --help). It intentionally contains *only* the
# protein_validation settings: do not duplicate apicomplexa_first_pass.yaml's
# other tuning here, and do not edit fungi_default.yaml or
# apicomplexa_first_pass.yaml for this. Run both layered together:
#
#   gmb-build \
#       --config configs/apicomplexa_first_pass.yaml \
#       --config configs/apicomplexa_chr1_protein_validation.example.yaml \
#       --seqname 1 \
#       ...

protein_validation:
  enabled: true
  # REQUIRED, machine-specific: point this at a local copy of the cluster's
  # uniprot_euk.fa.dmnd (site path:
  # /hps/nobackup/flicek/ensembl/genebuild/blastdb/uniprot_euk_diamond/).
  # Do not commit the .dmnd file itself (see .gitignore).
  diamond_db: "/path/to/local/uniprot_euk.fa.dmnd"
  # Psauron uses one bundled model and exposes no model-selection option;
  # -m specifies minimum protein length (see psauron_min_length below).
  psauron_min_length: 5
  # No CUDA GPU on this machine; let psauron probe for one and fall back
  # rather than forcing CPU, since that matched local testing. Set to true
  # for a deterministic CPU-only run (e.g. on a shared/headless box).
  psauron_use_cpu: false
  diamond_weight: 0.7
  psauron_weight: 0.3
  min_score: 0.7
  policy: "penalize"
