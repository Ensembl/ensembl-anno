orf:
  min_codons: 33
  allow_partial_5: true
  allow_partial_3: true
  allow_non_atg_start: false
  stop_codon_char: "*"
  partial_prefix: ""

protein_filter:
  min_protein_aa: 30
  min_exon_count_for_short: 1
  redundancy_overlap: 0.8
  top_n_per_locus: 3
  max_span_bp: 50000
  keep_secondary: true
  min_alignment_coverage: 0.8
  min_percent_identity: 60.0
  min_bitscore: 50.0

transcriptomic_filter:
  max_transcript_length: 20000
  max_intron_length: 3000
  min_intergenic_gap: 500
  allow_single_exon: true
  strand_consistency_check: false

transcript_splitting:
  split_enabled: true
  split_gap_bp: 3000
  split_on_contig_change: true
  split_on_strand_change: true
  split_on_large_exon_bp: 50000
  max_segments_per_transcript: 50

backbone_filter:
  min_cds_bp: 90
  max_exons: 50
  enabled: true

scoring:
  weights:
    backbone: 3.1
    scallop: 1.0
    stringtie: 1.0
  protein_overlap_bonus: 2.0
  multi_source_bonus: 0.5
  noncanonical_splice_penalty: 0.5
  # Was raised to 5 on 2026-05-05 ("fixes on internal stops plus tuning for
  # allowing more models") with golden fixtures/tests updated to match, then
  # lowered to 3 on 2026-05-12 ("trying for a happy medium config") alongside
  # several other scoring/protein_validation tuning changes in that same
  # commit -- but the tests and golden fixtures from the 5 change were never
  # reconciled with this later value. 3 has been the active production value
  # for all subsequent development (over two months as of this comment) with
  # no report of regression, so it is treated here as the current source of
  # truth; the tests that hard-coded 5 have been updated to read this value
  # directly rather than re-guessing a number. The precise biologically
  # optimal value (3 vs 5 vs something else) has not been re-benchmarked
  # since 2026-05-12 and awaits owner confirmation.
  max_isoforms_per_locus: 3
  min_alternate_score: 2.5
  fungal_single_exon_mode: true
  keep_backbone_without_support: true
  require_protein_support_for_single_source: true
  min_cds_bp: 150
  require_support_for_single_exon: true

# Protein validation is disabled in this portable default: enabling it here
# unconditionally required an EBI-only DIAMOND database path
# (/hps/nobackup/flicek/...) that does not exist outside the EBI cluster --
# including in GitHub Actions and any other contributor's machine -- so
# every plain `gmb-build` invocation with no --config silently crashed at
# --check-deps. See configs/ebi_protein_validation.example.yaml for the
# real EBI path as a layered overlay (`gmb-build --config
# configs/ebi_protein_validation.example.yaml ...`), and
# configs/apicomplexa_chr1_protein_validation.example.yaml for the pattern
# used to enable it against a locally-copied database. diamond_path/
# psauron_path/diamond_weight/psauron_weight/min_score/policy below are
# the tunable defaults that apply once protein_validation.enabled is
# switched on by an overlay -- they are inert while enabled is false.
protein_validation:
  enabled: false
  diamond_path: "diamond"
  psauron_path: "psauron"
  diamond_db: "swissprot.dmnd"
  diamond_weight: 0.7
  psauron_weight: 0.3
  min_score: 0.7
  policy: "penalize"

validation:
  mode: "drop_transcript"
  log_violations: true
  max_feature_drift_bp: 1500
  feature_outside_exons_policy: "trim"
  max_exon_len_bp: 15000
  
  max_exon_len_mode: "fixed"
  max_exon_len_percentile: 99.5
  max_exon_len_factor: 1.5
  max_exon_len_reference: "candidates_supported"

  max_transcript_span_mode: "off"
  max_transcript_span_bp: 100000
  max_transcript_span_percentile: 99.5
  max_transcript_span_factor: 1.5

utr:
  max_5p_bp: 2000
  max_3p_bp: 3000
  max_total_bp: 5000
  max_utr_to_cds_ratio: 5.0
  trim_policy: "hard_cap"
  require_end_support: true
  end_support_mode: "multisource_end_agreement"
  end_support_sources: ["Scallop", "StringTie"]
  end_tolerance_bp: 30
  require_multisource_for_utr_5p: true
  require_multisource_for_utr_3p: true
  fallback_policy_when_unsupported: "drop_utr"

dedup:
  enabled: true
  reciprocal_overlap_threshold: 0.80
  same_structure_tolerance_bp: 10
  policy: "merge_as_isoforms"

qc:
  max_transcripts_per_track: 5
  skip_orf_inference_tracks: ["OrthoDB", "UniProt"]
  parallel: false
  workers: 4

export:
  write_cdna: true
  write_protein: true
  write_cds: true
  include_partial: true

reporting:
  formats: ["json", "tsv"]
