# GMB fungi preset — overrides for compact-genome ascomycete / basidiomycete
# gene models, layered on top of standard.yaml.
#
# Only settings that differ from the neutral standard are listed here.
# All other values fall through to standard.yaml unchanged.
#
# Every number below reflects biology observed in fungi:
#   - Short introns (median ~60 bp; 3,000 bp covers virtually all real introns)
#   - Compact transcripts (median span ~1.5 kb; 20,000 bp caps chimeras)
#   - Many single-exon genes requiring relaxed single-exon logic
#   - Backbone (Helixer) is the dominant signal; higher weight than default
#   - Low isoform complexity per locus (typically 1-3)
#
# Validated against the bundled Z. tritici region fixture and the full
# Z. tritici genome.  Do not change thresholds here without re-validating.

orf:
  # Fungal genomes carry many real short-CDS genes; 33 codons keeps them.
  min_codons: 33

transcriptomic_filter:
  # Fungal transcripts rarely exceed 20 kb; removes chimeric joins.
  max_transcript_length: 20000
  # Fungal introns rarely exceed 3 kb; tighter than the neutral 1 Mbp default.
  max_intron_length: 3000

transcript_splitting:
  # Enabled: short introns make chimeric mega-transcripts common in fungi.
  split_enabled: true
  # Mirror max_intron_length as the split gap threshold.
  split_gap_bp: 3000
  # Cap individual exons at 50 kb before splitting.
  split_on_large_exon_bp: 50000

scoring:
  weights:
    # Helixer is well-trained on fungi; higher weight than the neutral base.
    backbone: 3.1
  # Reduced from standard 1.0: in fungi, multi-source agreement is a modest
  # rather than strong signal (transcriptomic and backbone often agree even
  # for borderline models).
  multi_source_bonus: 0.5
  # Fungi have low isoform complexity; rarely more than 3 per locus.
  max_isoforms_per_locus: 3
  min_alternate_score: 2.5
  # Special single-exon handling for organisms with many genuine single-exon
  # genes; controls protein-support requirements in evidence scoring.
  fungal_single_exon_mode: true
  # For a transcript supported by only one source, require protein support.
  require_protein_support_for_single_source: true

# ---------------------------------------------------------------------------
# Evidence-aware selection policy — DELIBERATELY NOT ENABLED
# ---------------------------------------------------------------------------
# The Apicomplexa selection policy was applied unchanged to the full
# Z. tritici IPO323 genome (21 chromosomes, Ensembl Fungi reference,
# 10,931 protein-coding genes) and made the annotation measurably WORSE:
#
#     CDS exact              4,895 -> 4,611   (-284)
#     CDS exact, multi-exon  2,984 -> 2,877   (-107)
#     Exact Match            1,881 -> 1,727   (-154)
#     locus detection       97.24% -> 94.91%
#   improvements : regressions = 249 : 555   (ratio 0.449)
#
# The fungal production default is therefore the VALIDATED BASELINE behaviour:
# the four policy flags below stay off. This is not caution for its own sake —
# it is the only fungal configuration with a validated whole-genome result.
#
# Why the policy does not transfer, measured from the inputs alone:
#   backbone (Helixer) multi-exon      71.9%   vs reference 69.8%
#   assembled transcripts multi-exon   90.7-92.1%
#   ratio assembled/backbone            1.27x
# The backbone is NOT under-calling introns, so there is nothing to rescue.
#
# CDS-exact rate by evidence bucket (baseline), which inverts against Apicomplexa:
#   backbone + short-read agreement    55.5%
#   backbone only                      30.1%
#   short-read only                     5.2%   <-- assemblies are far worse here
# Agreement with the backbone is strong evidence; replacing the backbone with a
# short-read-only structure is usually harmful.
  # Off: see the ratio above. `auto` would decline anyway (71.9% > 55% gate),
  # but stating it explicitly documents the decision and survives a gate change.
  backbone_intron_rescue: "off"   # YAML bare `off` is boolean False; quoted for clarity
  # Off: the validated fungal baseline. Independent structural agreement DOES
  # enrich for correctness in fungi (multi-source 42.7% vs single-source 28.1%),
  # so this is a promising candidate to enable — but only after a per-flag
  # experiment. It has never been validated in isolation on a fungal genome.
  structural_corroboration: false
  # Off: the validated fungal baseline. Protein support IS monotone in fungi
  # (strong 37.5% / positional-only 5.1% / none 0.7%), unlike in Apicomplexa,
  # so this is the second candidate to enable after a per-flag experiment.
  protein_support_mode: positional
  # Off: no long-read evidence existed for the validated genome, so the guard
  # is provably inert there (it can only demote long-read-only structures).
  # Enable it, or set longread_disposition, if you supply a long-read track —
  # and run preflight first to check its splice quality.
  longread_structural_guard: false


protein_validation:
  # Tuned weights for SwissProt-trained models on fungal proteins.
  diamond_weight: 0.7
  psauron_weight: 0.3
  min_score: 0.7
  # Penalize rather than drop: preserves models that may lack DB coverage.
  policy: penalize

utr:
  # Fungal UTRs are shorter than in most other eukaryotes.
  max_5p_bp: 2000
  max_3p_bp: 3000
  max_total_bp: 5000
  # Tighter boundary-wobble tolerance for compact UTRs.
  end_tolerance_bp: 30
