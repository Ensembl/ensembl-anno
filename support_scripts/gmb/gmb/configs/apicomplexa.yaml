# GMB apicomplexa preset — overrides for Apicomplexa gene models.
#
# Derived from the P. falciparum GCA_000002765.3 reference annotation and a
# Tiberius-only baseline comparison.  All numbers are grounded in statistics
# computed from the reference (see configs/apicomplexa_first_pass.yaml for the
# full derivation notes).  This preset is layered on top of standard.yaml.
#
# Apicomplexa characteristics that drive the overrides:
#   - Compact genomes with short introns (max ~2,425 bp in P. falciparum)
#   - High single-exon gene fraction (~45.6% in P. falciparum)
#   - Life-stage-specific expression → backbone-only loci are real
#   - Tiberius is the only ab initio predictor (no Helixer model available)
#   - AT-rich amino-acid composition depresses cross-species DIAMOND bitscores
#   - Long 5' UTRs relative to most eukaryotes (p99 ~2,633 bp)

orf:
  # P. falciparum gene lengths are long (mean 762 aa); only 1 of 5,389
  # reference CDS is shorter than 33 codons.  Keep 33 (same as fungi) because
  # it is already a near-non-filter here and raising it risks cutting real
  # short genes.
  min_codons: 33

protein_filter:
  # genBlastG scores are not calibrated DIAMOND bitscores; observed range
  # includes negative values alongside real hits.  Loosened conservatively
  # for this first pass; revisit after reviewing OrthoDB/GenBlast filtering.
  min_bitscore: 30.0

transcriptomic_filter:
  # Reference spans reach 32,487 bp (p99=14,717 bp, p99.9=26,920 bp).
  # 35,000 bp keeps the real tail of large multi-exon genes.
  max_transcript_length: 35000
  # P. falciparum introns max at 2,425 bp (p50=141 bp, p99=736 bp).
  # 2,500 bp gives chimera detection with headroom above the observed maximum.
  max_intron_length: 2500

transcript_splitting:
  # Enabled: short introns make chimeric joins common in RNA-seq assemblies,
  # as in fungi.
  split_enabled: true
  # Mirror max_intron_length as the split gap threshold.
  split_gap_bp: 2500
  # Fungal value retained: 50 kb exon cap before splitting.
  split_on_large_exon_bp: 50000

scoring:
  weights:
    # Reduced from standard 2.0 and fungi 3.1: in the Tiberius-only baseline
    # Tiberius got the exact multi-exon structure right for only 1.5% of
    # multi-exon reference genes (45/2,949); its multi-exon splice placement
    # is the clear weak point.
    backbone: 2.6
    # Long-read evidence (when collapsed consensus is supplied) spans full
    # introns directly rather than relying on splice-junction inference.
    minimap2: 1.3
  # Raised from standard 1.0: rewards loci where Tiberius agrees with
  # independent transcriptomic evidence — exactly where Tiberius structural
  # errors are corrected by multi-source support.
  multi_source_bonus: 1.2
  # Fungi value: P. falciparum loci typically have low isoform complexity.
  max_isoforms_per_locus: 3
  # Fungi value: consistent with how single-exon genes are handled.
  min_alternate_score: 2.5
  # P. falciparum has ~45.6% genuinely single-exon genes; the same
  # single-exon handling logic used in fungi is appropriate here.
  fungal_single_exon_mode: true
  # Fungi value: for a transcript supported by only one source, require
  # protein evidence.
  require_protein_support_for_single_source: true
  # No Helixer model exists for this genome; Tiberius is the backbone.
  backbone_label: Tiberius

protein_validation:
  # Fungi values for weights and threshold retained; no DIAMOND database is
  # available locally for this genome.  enabled=false prevents hard failure
  # at --check-deps when no db is configured.
  diamond_weight: 0.7
  psauron_weight: 0.3
  min_score: 0.7
  policy: penalize

utr:
  # P. falciparum 5' UTRs: p50=497 bp, p90=1,344 bp, p99=2,633 bp.
  # Standard's 5,000 bp is too permissive; 3,000 bp captures the real p99
  # tail while trimming pathological extensions.
  max_5p_bp: 3000
  # 3' UTRs are comfortably under the fungi cap (real p99=1,506 bp).
  # Keep 3,000 bp (fungi value) rather than raising to standard's 5,000 bp.
  max_3p_bp: 3000
  # Raised proportionally to accommodate the longer 5' UTRs.
  max_total_bp: 6000
  # Fungi value: tighter boundary wobble for compact UTRs.
  end_tolerance_bp: 30

qc:
  # GenBlast evidence is a protein-to-genome alignment (like OrthoDB/UniProt),
  # not a transcript assembly; ORF inference should be skipped for it.
  skip_orf_inference_tracks:
    - OrthoDB
    - UniProt
    - GenBlast
