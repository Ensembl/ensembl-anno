# GMB standard configuration — organism-neutral base.
#
# This file is always loaded first by load_config().  Clade preset files
# (e.g. fungi.yaml, apicomplexa.yaml) and user-supplied --config files are
# applied on top as ordered layers:
#
#   standard.yaml
#       → optional clade/workflow preset (--preset fungi | apicomplexa | ...)
#           → user-supplied --config files (in order)
#
# Every field of every dataclass section is listed here so the effective base
# is fully explicit; nothing falls through to the Python dataclass defaults.
# "Neutral" means: no assumption about genome compactness, intron length,
# isoform complexity, or clade-specific gene structure.  Clade presets supply
# those assumptions for their respective organisms.

# ---------------------------------------------------------------------------
# orf — open-reading-frame detection
# ---------------------------------------------------------------------------
orf:
  # Minimum ORF length in codons.  50 is conservative for diverse eukaryotes;
  # compact-genome clades (fungi, many parasites) lower this to 33.
  min_codons: 50
  # Retain partial ORFs that lack a start codon (useful at assembly ends).
  allow_partial_5: true
  # Retain partial ORFs that lack a stop codon.
  allow_partial_3: true
  # Accept non-ATG starts (rare; off by default).
  allow_non_atg_start: false
  stop_codon_char: "*"
  partial_prefix: ""

# ---------------------------------------------------------------------------
# protein_filter — protein-alignment evidence (OrthoDB, UniProt, GenBlast)
# ---------------------------------------------------------------------------
protein_filter:
  min_protein_aa: 30
  min_exon_count_for_short: 1
  redundancy_overlap: 0.80
  top_n_per_locus: 3
  max_span_bp: 50000
  keep_secondary: true
  min_alignment_coverage: 0.80
  min_percent_identity: 60.0
  min_bitscore: 50.0

# ---------------------------------------------------------------------------
# transcriptomic_filter — RNA-seq assembly evidence (Scallop, StringTie)
# ---------------------------------------------------------------------------
transcriptomic_filter:
  # Upper bound on transcript span (bp); null disables the filter.
  # Compact-genome clades set this to a species-appropriate ceiling.
  max_transcript_length: 2000000
  # Drop transcripts with any intron longer than this.  Large for neutrality
  # (vertebrates have introns > 1 Mbp); compact-genome clades lower this.
  max_intron_length: 1000000
  min_intergenic_gap: 500
  allow_single_exon: true
  strand_consistency_check: false

# ---------------------------------------------------------------------------
# transcript_splitting — chimeric "mega-transcript" splitting
# ---------------------------------------------------------------------------
transcript_splitting:
  # Disabled in the neutral base; compact-genome presets enable it because
  # short introns make chimeric joins common in RNA-seq assemblies.
  split_enabled: false
  # Gap that triggers a split (mirrors max_intron_length in clade presets).
  split_gap_bp: 3000
  split_on_contig_change: true
  split_on_strand_change: true
  # Cap individual exons at this length before splitting; null = no cap.
  split_on_large_exon_bp: null
  max_segments_per_transcript: 50

# ---------------------------------------------------------------------------
# backbone_filter — ab initio backbone plausibility (Helixer / Tiberius)
# ---------------------------------------------------------------------------
backbone_filter:
  min_cds_bp: 90
  max_exons: 50
  enabled: true

# ---------------------------------------------------------------------------
# scoring — isoform scoring and selection
# ---------------------------------------------------------------------------
scoring:
  weights:
    backbone: 2.0     # raised in clade presets tuned to a specific predictor
    scallop: 1.0
    stringtie: 1.0
    minimap2: 1.0
  protein_overlap_bonus: 2.0
  # Bonus when a transcript is supported by multiple independent source classes.
  multi_source_bonus: 1.0
  noncanonical_splice_penalty: 0.5
  # Maximum isoforms retained per locus.  5 is permissive for complex genomes;
  # compact-genome presets lower this (e.g. fungi uses 3).
  max_isoforms_per_locus: 5
  min_alternate_score: 3.0
  # Fungal-specific single-exon handling (requires protein support for
  # single-source single-exon models).  Off in the neutral base.
  fungal_single_exon_mode: false
  keep_backbone_without_support: true
  require_protein_support_for_single_source: false
  min_cds_bp: 150
  require_support_for_single_exon: true
  same_gene_overlap_threshold: 0.15
  # Set automatically by the CLI (--helixer → Helixer, --tiberius → Tiberius).
  backbone_label: Helixer

# ---------------------------------------------------------------------------
# protein_validation — DIAMOND + Psauron protein-coding validation
# ---------------------------------------------------------------------------
protein_validation:
  # Disabled in the neutral base; enable via a project --config overlay.
  enabled: false
  diamond_path: diamond
  psauron_path: psauron
  # No database path is provided; must be set explicitly when enabled=true
  # and diamond_weight > 0.  No default is safe across sites or organisms.
  diamond_db: null
  psauron_min_length: 5
  psauron_use_cpu: false
  # Neutral 50/50 weighting; clade presets may favour one tool over the other.
  diamond_weight: 0.5
  psauron_weight: 0.5
  min_score: 0.5
  # "drop" removes low-scoring transcripts; "penalize" reduces their rank.
  policy: drop
  diamond_min_query_coverage: 0.0
  diamond_min_target_coverage: 0.0

# ---------------------------------------------------------------------------
# validation — GFF3 structural validation and repair
# ---------------------------------------------------------------------------
validation:
  # "drop_transcript" removes the transcript on structural violation;
  # "fix" repairs minor violations; "error" aborts.
  mode: drop_transcript
  log_violations: true
  max_feature_drift_bp: 1500
  feature_outside_exons_policy: trim
  max_exon_len_bp: 15000
  max_exon_len_mode: fixed
  max_exon_len_percentile: 99.5
  max_exon_len_factor: 1.5
  max_exon_len_reference: candidates_supported
  max_transcript_span_mode: off
  max_transcript_span_bp: 100000
  max_transcript_span_percentile: 99.5
  max_transcript_span_factor: 1.5

# ---------------------------------------------------------------------------
# utr — UTR retention and end-support validation
# ---------------------------------------------------------------------------
utr:
  # Permissive caps for diverse eukaryotes; compact-genome presets tighten.
  max_5p_bp: 5000
  max_3p_bp: 5000
  max_total_bp: 10000
  max_utr_to_cds_ratio: 5.0
  trim_policy: hard_cap
  require_end_support: true
  end_support_mode: multisource_end_agreement
  end_support_sources:
    - Scallop
    - StringTie
  # Boundary wobble tolerance; clade presets may tighten for compact genomes.
  end_tolerance_bp: 50
  require_multisource_for_utr_5p: true
  require_multisource_for_utr_3p: true
  fallback_policy_when_unsupported: drop_utr
  min_protein_coding_score_for_utr: null
  max_end_extension_bp: null

# ---------------------------------------------------------------------------
# dedup — gene deduplication (overlap-based)
# ---------------------------------------------------------------------------
dedup:
  enabled: true
  reciprocal_overlap_threshold: 0.80
  same_structure_tolerance_bp: 10
  policy: merge_as_isoforms

# ---------------------------------------------------------------------------
# duplicate_transcript_collapse — exact-duplicate transcript collapsing
# ---------------------------------------------------------------------------
duplicate_transcript_collapse:
  collapse_exact_duplicates: true
  preserve_distinct_utrs: true
  preserve_distinct_proteins: true
  require_matching_cds_phase: true

# ---------------------------------------------------------------------------
# qc — per-track quality-control thresholds
# ---------------------------------------------------------------------------
qc:
  max_transcripts_per_track: 5
  skip_orf_inference_tracks:
    - OrthoDB
    - UniProt
  parallel: false
  workers: 4

# ---------------------------------------------------------------------------
# export
# ---------------------------------------------------------------------------
export:
  write_cdna: true
  write_protein: true
  write_cds: true
  include_partial: true

# ---------------------------------------------------------------------------
# reporting
# ---------------------------------------------------------------------------
reporting:
  formats:
    - json
    - tsv

# ---------------------------------------------------------------------------
# canonical_selection — post-build canonical transcript ranking
# ---------------------------------------------------------------------------
canonical_selection:
  enabled: true
  low_confidence_score_gap: 0.05
  protein_validation:
    psauron_weight: 0.35
    diamond_identity_weight: 0.15
    diamond_balanced_coverage_weight: 0.30
    diamond_hit_bonus: 0.20
  evidence:
    gmb_score_weight: 0.30
    independent_source_weight: 0.15
    independent_source_cap: 3
    transcriptomic_support_weight: 0.10
    protein_alignment_support_weight: 0.10
    longread_support_weight: 0.10
    backbone_support_weight: 0.10
  structure:
    complete_orf_bonus: 0.30
    internal_stop_penalty: 0.50
    partial_cds_penalty: 0.20
  domains:
    enabled: false
    domain_support_weight: 0.0
    domain_coverage_weight: 0.0
    complete_domain_bonus: 0.0
    fragmented_domain_penalty: 0.0
    suspicious_fusion_penalty: 0.0
    cross_provider_agreement_bonus: 0.0
  interpro_resolver:
    enabled: false
    run_interproscan: false
    apply_replacements: true
    min_isoforms: 2
    max_candidates_per_gene: 2
    close_call_score_gap: 0.10
    trigger_low_confidence: true
    trigger_close_score: true
    trigger_diamond_psauron_disagree: true
    trigger_length_or_lexical_only: true
    trigger_internal_stop_conflict: true
    length_ratio_flag: 1.5
    min_coverage_delta_for_replacement: 0.10
    require_no_worse_structural_class: true
    require_no_new_internal_stops: true
    max_protein_validation_override_gap: 0.15
    nextflow:
      nextflow_executable: nextflow
      workflow: ebi-pf-team/interproscan6
      revision: "6.0.1"
      profile: docker
      config_file: null
      data_dir: null
      interpro_release: latest
      applications: null
      work_dir: null
      output_dir: null
      cpus: null
      max_workers: null
      extra_args: []
