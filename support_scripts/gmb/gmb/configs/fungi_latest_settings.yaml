# Latest fungal settings — the recommended configuration for fungal genomes.
#
#   gmb-run --preset fungi_latest_settings ...        (see RUN_FUNGI.md)
#
# A layered preset: GMB loads standard.yaml, then the `fungi` preset, then the
# four settings below (gmb.pipeline.config.PRESET_BASES). Nothing else differs
# from `fungi`, which is kept as the historical baseline for reproducibility.
# gmb-finalise reads the build's resolved_config.yaml, so canonical selection
# uses the same settings automatically.
#
# Until 2026-10-12 this file was configs/fungi_evidence_integration.experimental.yaml,
# applied as `--preset fungi --config <file>`; that combination gives identical
# results. Each setting addresses a failure measured on Zymoseptoria tritici
# (17 windows, 9 development + 8 held-out): docs/release/evidence_integration.md.
# Validated regionally; the genome-wide confirmation is the production-scale run.

scoring:
  # Where Helixer's model has introns that no assembled transcript observes,
  # promote an admitted alternate whose introns are observed, with a complete
  # ORF, >= 90% of the backbone CDS, shared coding locus and no worse spliced
  # protein agreement. The plain fungi preset keeps the backbone primary at
  # every locus it predicts, whatever the transcripts show.
  primary_selection: junction_supported
  # A structure that shares no coding base with its gene's primary is not an
  # isoform of that gene (UTR / read-through overlap); discard it. Removes the
  # isoform-driven gene merges and splits.
  isoform_cds_overlap: drop
  # Retention floor on candidate CDS length. No Z. tritici reference CDS is
  # shorter; the removed models are almost all unsupported novel loci.
  min_cds_bp: 150

canonical_selection:
  # Do not let two short-read assemblers of the same libraries (counted as two
  # sources) displace the build's primary transcript.
  prefer_build_primary: true
