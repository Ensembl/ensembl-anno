[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-model-builder"
version = "2.0.0"
description = "Consensus gene model builder for eukaryotic genomes"
# Minimum version is 3.10: the production cluster runs 3.10.20 (conda-forge),
# all dependencies are compatible, and all modules use `from __future__ import
# annotations` to allow X | Y union syntax.  3.9 was removed from the CI
# matrix after confirming it was never exercised in production.
# See python_compat/ for the full compatibility audit.
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "pyranges>=0.0.120,<=0.1.4",
    "biopython",
    "pyyaml",
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.12",
]

[project.scripts]
gmb-build = "gmb.cli.build:main"
gmb-compare = "gmb.cli.compare:main"
gmb-visualize = "gmb.cli.visualize:main"
gmb-longread-consensus = "gmb.cli.longread_consensus:main"
gmb-canonical-selection = "gmb.cli.canonical_selection:main"
gmb-interpro-review = "gmb.cli.interpro_review:main"
gmb-interpro-resolve = "gmb.cli.interpro_resolve:main"
gmb-finalise = "gmb.cli.finalise:main"

[tool.setuptools.packages.find]
include = ["gmb*"]

[tool.setuptools.package-data]
"gmb.configs" = ["*.yaml"]
"gmb.configs.longread_consensus" = ["*.yaml"]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 99
target-version = ["py310"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 99
known_first_party = [
    "gmb",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by black
    "E741",   # ambiguous variable name (common in genomics: l, s, e)
    "B905",   # zip strict — semantics differ from plain zip; explicit is safer
    "SIM108", # ternary — sometimes less readable
    "UP007",  # Optional[X] / Union[X, Y] kept for readability; X|Y valid in 3.10+ but style choice
    "UP045",  # Optional[X] kept for readability — same reason as UP007
    "UP022",  # capture_output — less readable than explicit stdout=/stderr=
    "RUF002", # ambiguous unicode in docstring — prime symbols (′) intentional in genomics
    "RUF003", # ambiguous unicode in comment — same reason
    "SIM102", # nested if — collapsing hurts readability in complex filter logic
    "SIM115", # context manager — false positives in try/finally patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF", "F841", "E712", "F401"]
"gmb/compare/visualize_disagreements.py" = ["SIM102", "SIM115", "RUF059"]
"gmb/compare/compare_annotations.py" = ["SIM102", "SIM115", "RUF059"]
# `== True` used deliberately: comparison_details.tsv columns are read back
# as object dtype (can hold NaN alongside True/False), where a plain truth
# check and an explicit `== True` differ for NaN -- an explicit comparison
# is the safer, intent-revealing choice here, not an oversight.
"gmb/compare/tool_performance_analysis.py" = ["E712"]
# __all__ in the longread package __init__ is grouped by logical category (config,
# io, rescue, reporting) for readability; alphabetical sorting would destroy that.
"gmb/pipeline/longread/__init__.py" = ["RUF022"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests using real data (may be slow)",
    "external_tools: tests requiring DIAMOND / Psauron (skipped unless RUN_EXTERNAL_TOOLS=1)",
]
