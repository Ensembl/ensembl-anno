# pyproject.toml -- Ensembl Anno project configuration

[project]
name = "ensembl-anno" 

# Versions should comply with PEP 440:
version = "0.1.0"  # Required

description = "Ensembl Anno - pipeline to provide genome annotation"

requires-python = ">=3.10"
authors = [
    {name = "Ensembl", email = "dev@ensembl.org"},
]
maintainers = [
    {name = "Ensembl", email = "dev@ensembl.org"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]


dependencies = [ 
    "psutil",
    "numpy"
]


[project.optional-dependencies] # Optional
cicd = [
    "black==25.11.0",
    "coverage",
    "mypy",
    "pylint",
    "pytest",
]
dev = [
    "black==23.3.0",
    "coverage",
    "ipython",
    "mock",
    "mypy",
    "pylint",
    "pytest",
    "sphinx",
]
docs = [
    "mock",
    "sphinx>=7",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinxcontrib-bibtex",
]

[project.urls]  
homepage = "https://www.ensembl.org"
repository = "https://github.com/Ensembl/ensembl-anno"


# This is configuration specific to the `setuptools` build backend.
# If you are using a different build backend, you will need to change this.
[tool.setuptools]
# If there are data files included in your packages that need to be
# installed, specify them here.
#package-data = {"ensembl-anno" = ["data"]}
package-dir = {"" = "bin/src/python"}

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "setuptools-scm", "wheel"]



[tool.setuptools.packages.find]
#where = ["src/python/ensembl/tools/anno"]  # list of folders that contain the packages (["."] by default)
where = ["bin/src/python"]

[tool.black]
line-length = 110



[tool.mypy]
#mypy_path = "src/python"
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.pylint.messages_control]
max-line-length = 110

disable = [
    "invalid-name",
    "similarities",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "unspecified-encoding",
    "wildcard-import"
]

